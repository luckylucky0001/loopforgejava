name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loopforge
          POSTGRES_PASSWORD: loopforge
          POSTGRES_DB: loopforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loopforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LANG: C.UTF-8
      LOOPFORGE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/loopforge_test
      LOOPFORGE_TEST_POSTGRES_USER: loopforge
      LOOPFORGE_TEST_POSTGRES_PASSWORD: loopforge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test, check formatting and coverage
        run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the Compose stack (app + PostgreSQL, prod profile)
        env:
          LOOPFORGE_API_TOKEN: ci-smoke-token-0123456789-abcdefghij
          POSTGRES_PASSWORD: ci-postgres-password
          LOOPFORGE_DEMOCATALOG: "true"
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test the running image
        run: scripts/smoke-test.sh http://localhost:8090 ci-smoke-token-0123456789-abcdefghij
      - name: Container logs
        if: always()
        env:
          LOOPFORGE_API_TOKEN: unused-for-logs-0123456789-abcdefghij
          POSTGRES_PASSWORD: unused
        run: docker compose logs --no-color loopforge | tail -200
